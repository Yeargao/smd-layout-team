<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMD layout editor</title><style>body{font:15px system-ui;margin:16px;color:#253044}h1{font-size:22px;margin:0}p{margin:8px 0}button,input,select{margin:4px;padding:5px}button{cursor:pointer}svg{border:1px solid #aaa;width:100%;height:72vh;touch-action:none;background:#fafafa}circle{cursor:grab}#menu{position:fixed;background:white;border:1px solid #aaa;padding:4px;z-index:5}#menu[hidden]{display:none}#status{font-size:13px}button:focus-visible{outline:2px solid #2563eb}</style></head><body><h1>SMD layout editor</h1><p>Drag nodes and orange handles. Click an arrow to select it; double-click an arrow to insert a bend; right-click a bend to remove it. Right-click a region to collapse or expand. Save JSON to retain the layout.</p><button id="auto">Auto-layout (reset)</button><label>Parent region <select id="parent"><option value="">Root</option></select></label><button id="addNode">Add node</button><button id="addRegion">Add region</button><button id="addEdge">Add edge</button><button id="resetEdge">Auto-route selected edge</button><button id="fit">Fit view</button><button id="save">Save JSON</button><label>Load JSON <input id="load" type="file" accept="application/json"></label><span id="status" role="status"></span><svg id="canvas" viewBox="0 0 1200 780" aria-label="State machine diagram"></svg><div id="menu" hidden><button id="toggle">Collapse / expand</button></div><script type="module" src="src/editor.js"></script></body></html>
